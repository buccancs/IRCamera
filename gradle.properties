# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# DEVELOPMENT BUILD OPTIMIZATION - Maximized for 17+ module enterprise project
# Specifies the JVM arguments used for the daemon process.
# Optimized heap allocation with faster GC settings for development efficiency  
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=100 -XX:G1HeapRegionSize=32m

# Build Performance Optimizations - Maximized parallelization for development
# Enable maximum parallel builds and caching for enterprise build speed
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.workers.max=16

# Gradle Build Cache optimization - enable configuration cache for better performance
org.gradle.configuration-cache=true
org.gradle.configuration-cache-problems=warn

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Production Optimizations
# Enhanced incremental annotation processing for enterprise builds
kapt.incremental.apt=true
kapt.include.compile.classpath=false
# Modern kapt configuration for AGP 8.1+ - disable k2 for compatibility
kapt.use.worker.api=true
# Disable Kotlin 2.1.0 K2 in kapt for stability (causes unrecognized processor warnings)
kapt.use.k2=false

# R8/ProGuard optimizations - Remove deprecated android.enableR8
android.enableR8.fullMode=true

# Dependency resolution strategy - Enhanced network configuration
systemProp.http.keepAlive=false
systemProp.http.maxConnections=10
systemProp.https.protocols=TLSv1.2,TLSv1.3

# Suppress AGP compatibility warning for compileSdk 34
android.suppressUnsupportedCompileSdk=34

# Enhanced build performance improvements with file system monitoring
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# Advanced Kotlin compiler optimizations for enterprise builds
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true
# Enable Kotlin incremental compilation across modules for faster builds
kotlin.incremental.multiplatform=true
kotlin.incremental.js=true
kotlin.incremental.js.klib=true
# Force consistent JVM target for all Kotlin compilation
kotlin.jvm.target.validation.mode=warning

# Development Build Optimizations - Fast iteration for 17+ modules
# Disable resource shrinking and obfuscation for debug builds
android.enableResourceOptimizations=false
# Enable non-transitive R classes for faster builds
android.nonTransitiveRClass=true
# Enable non-constant R class fields for development
android.nonFinalResIds=true

# Kapt optimizations for development efficiency  
kapt.incremental.apt=true
kapt.include.compile.classpath=false
kapt.use.worker.api=true
# Disable K2 for compatibility but enable faster compilation
kapt.use.k2=false
kapt.verbose=false

# Enhanced build scan and profiling for optimization analysis
# Enable build scans for performance analysis (development only)
org.gradle.welcome=never
org.gradle.console=rich
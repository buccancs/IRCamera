#!/usr/bin/env yaml
# Pre-commit hooks for IRCamera project quality assurance
# Install with: pip install pre-commit && pre-commit install

repos:
  # Python Code Quality
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        files: ^pc-controller/.*\.py$
        args: [--line-length=88]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^pc-controller/.*\.py$
        args: [--profile=black]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        files: ^pc-controller/.*\.py$
        args: [--max-line-length=88, --extend-ignore=E203,W503]

  # Security and vulnerability scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        files: ^pc-controller/.*\.py$
        args: [-r, -f, json, -o, security-report.json]
        pass_filenames: false

  # General code quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # Detect secrets and sensitive data
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: \.git/.*|.*\.lock$|.*\.gradle$

  # Chinese character detection for internationalization
  - repo: local
    hooks:
      - id: check-chinese-comments
        name: Check for Chinese characters in code comments
        entry: ./scripts/check-chinese-comments.sh
        language: script
        files: \.(java|kt|py)$
        exclude: (migration_backup|test|spec)

  # Android/Kotlin specific checks
  - repo: local
    hooks:
      - id: ktlint
        name: Kotlin Lint
        entry: ./gradlew ktlintCheck
        language: system
        files: \.kt$
        pass_filenames: false
        require_serial: true

  # TODO/FIXME tracking
  - repo: local
    hooks:
      - id: check-todos
        name: Check TODO/FIXME formatting
        entry: ./scripts/check-todos.sh
        language: script
        files: \.(java|kt|py)$
        exclude: (migration_backup|/charting/|test|spec)
[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = "E203,W503"
exclude = ".git,__pycache__,build,dist,.eggs"

[tool.pytest.ini_options]
testpaths = ["pc-controller"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
"""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gui: marks tests that require GUI/display",
]
# Configure asyncio mode for async tests
asyncio_mode = "auto"
# Set environment variables for headless PyQt6 testing
env = [
    "QT_QPA_PLATFORM=offscreen",
    "DISPLAY=:99",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true

# Specific module configuration
[[tool.mypy.overrides]]
module = ["ircamera_pc.gui.*"]
ignore_errors = false

[[tool.mypy.overrides]]
module = ["ircamera_pc.network.*"]
ignore_errors = false

[[tool.mypy.overrides]]
module = ["ircamera_pc.core.*"]
ignore_errors = false

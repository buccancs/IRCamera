name: Build and Validate

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  android-build:
    name: Android Gradle (Best-Effort)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle Clean
        run: |
            set -euxo pipefail
            ./gradlew clean || echo "Clean failed (continuing)."

      - name: Assemble Debug (Allow Failure)
        continue-on-error: true
        run: |
            set -euxo pipefail
            ./gradlew --stacktrace assembleDebug

      - name: Collect Build Artifacts
        if: always()
        run: |
            mkdir -p build-logs
            find . -type f -path "*/build/reports/*" -exec cp --parents {} build-logs/ \; || true
            find . -type f -path "*/build/outputs/*" -exec cp --parents {} build-logs/ \; || true

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: build-logs
          if-no-files-found: warn

  python-pc-controller:
    name: PC Controller Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          if [ -d pc-controller ]; then
            cd pc-controller
            pip install --upgrade pip
            pip install PyQt6 loguru zeroconf numpy pandas h5py pyqtgraph scipy opencv-python bleak psutil || true
          else
            echo "pc-controller directory missing"
          fi

      - name: Smoke Test (Optional)
        continue-on-error: true
        run: |
          if [ -f pc-controller/test_mvp_simple.py ]; then
            python pc-controller/test_mvp_simple.py || echo "Smoke test failed (allowed)."
          else
            echo "No test script."
          fi
